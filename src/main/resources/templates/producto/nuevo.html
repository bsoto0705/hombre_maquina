<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Producto - InventoryPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'display': ['Outfit', 'sans-serif'],
                        'mono': ['Space Mono', 'monospace'],
                    },
                    colors: {
                        'brand': {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c4b5fd',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#4c1d95',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Outfit', sans-serif; }
    </style>
</head>

<body class="bg-slate-50 text-slate-800">
    <nav class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-slate-200/50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center shadow-lg shadow-brand-600/30">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                    </svg>
                </div>
                <span class="font-bold text-xl tracking-tight">InventoryPro</span>
            </div>
            <div class="flex items-center gap-6">
                <a href="/" class="text-slate-600 hover:text-brand-600 transition-colors font-medium">Inicio</a>
                <a href="/productos" class="text-brand-600 font-medium">Productos</a>
            </div>
            <a href="/productos/nuevo" class="bg-brand-600 hover:bg-brand-700 text-white px-5 py-2.5 rounded-lg font-semibold transition-all shadow-lg shadow-brand-600/30">
                + Nuevo Producto
            </a>
        </div>
    </nav>

    <main class="pt-24 pb-12">
        <div class="max-w-2xl mx-auto px-6">
            <div class="mb-8">
                <div class="flex items-center gap-2 text-sm text-slate-500 mb-2">
                    <a href="/productos" class="hover:text-brand-600">Productos</a>
                    <span>/</span>
                    <span class="text-slate-800">Nuevo Producto</span>
                </div>
                <h1 class="text-3xl font-bold text-slate-800" th:text="${titulo}">Nuevo Producto</h1>
            </div>

            <div class="bg-white rounded-2xl shadow-lg border border-slate-100 p-8">
                <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" class="space-y-6">
                    <div>
                        <label for="nombre" class="block text-sm font-medium text-slate-700 mb-2">Nombre del Producto</label>
                        <input type="text" id="nombre" th:field="*{nombre}" required
                            class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all"
                            placeholder="Ingresa el nombre del producto">
                    </div>

                    <div>
                        <label for="descripcion" class="block text-sm font-medium text-slate-700 mb-2">Descripción</label>
                        <textarea id="descripcion" th:field="*{descripcion}" required rows="4"
                            class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all resize-none"
                            placeholder="Describe el producto"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label for="precio" class="block text-sm font-medium text-slate-700 mb-2">Precio</label>
                            <div class="relative">
                                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">$</span>
                                <input type="number" id="precio" th:field="*{precio}" step="0.01" min="0" required
                                    class="w-full pl-8 pr-4 py-3 rounded-lg border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all"
                                    placeholder="0.00">
                            </div>
                        </div>

                        <div>
                            <label for="stock" class="block text-sm font-medium text-slate-700 mb-2">Stock</label>
                            <input type="number" id="stock" th:field="*{stock}" min="0" required
                                class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none transition-all"
                                placeholder="0">
                        </div>
                    </div>

                    <div class="flex items-center gap-4 pt-4">
                        <button type="submit"
                            class="bg-brand-600 hover:bg-brand-700 text-white px-6 py-3 rounded-lg font-semibold transition-all shadow-lg shadow-brand-600/30 hover:shadow-brand-600/50">
                            Guardar Producto
                        </button>
                        <a href="/productos"
                            class="px-6 py-3 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 transition-colors font-medium">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
